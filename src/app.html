<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#F4F1E6" />
		<!-- home screen: the manifest and apple tags name the app LEDGER; the 180px PNG is the icon iOS reads, it ignores SVG favicons -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/icon-180-v2.png" />
		<meta name="apple-mobile-web-app-title" content="LEDGER" />
		<meta name="mobile-web-app-capable" content="yes" />
		<!-- the two faces are self-hosted (src/lib/design/fonts.css); preloaded so the first paint has them -->
		<link rel="preload" href="/fonts/Archivo-Variable-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/JetBrainsMono-Variable-latin.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
